<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #E8ECED;
            font-family: Arial;
            color: white;
            text-align: center;
        }

        #card{

            background-image: url("images/christus.webp");
            
            width: 80%;
            max-width: 700px;
            padding: 20px;
            border: 5px solid black;
            border-radius: 5%;

        }

        .Apostles {
            
            height: 80px;
            width: 80px;
            border: 5px solid white;
            border-radius: 50%;
            object-fit: cover;

        }

        

        #Quorum{

            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 15px; 

        }

        #First-Presidency{

            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;

        }

        #First-Presidency img{
            width: 7em;
            height: 7em;
        }

        #prophet {
            width: 9em;
            height: 9em; 
        }


    </style>
</head>

<body>
    <div id ="card">
            <h1>The First Presidency</h1>
        <div id="First-Presidency">
            <img class="Apostles" src="images/eyring.webp" alt="Henry B. Eyring">
            <img class="Apostles" id= "prophet" src="images/oaks.webp" alt="Dallin H. Oaks">
            <img class="Apostles" src="images/christofferson.webp" alt="D. Todd Christofferson">
        </div>
            <h2>Quorum of the Twelve Apostles</h2>
        <div id= "Quorum">
            <img class="Apostles" src="images/uchtdorf.webp" alt="Dieter F. Uchtdorf">
            <img class="Apostles" src="images/bednar.webp" alt="David A. Bednar">
            <img class="Apostles" src="images/cook.webp" alt="Quentin L. Cook">
            <img class="Apostles" src="images/anderson.webp" alt="Neil L. Anderson">
            <img class="Apostles" src="images/rasband.webp" alt="Ronald A. Rasband">
            <img class="Apostles" src="images/stevenson.webp" alt="Gary E. Stevenson">
            <img class="Apostles" src="images/renlund.webp" alt="Dale G. Renlund">
            <img class="Apostles" src="images/gong.webp" alt="Gerrit W. Gong">
            <img class="Apostles" src="images/soares.webp" alt="Ulysess Soares">
            <img class="Apostles" src="images/kearon.webp" alt="Patrick Kearon">
            <img class="Apostles" src="images/causse.webp" alt="Gerald Causse">
            <img class="Apostles" src="images/gilbert.webp" alt="Clark G. Gilbert">
        </div>

    </div>
</body>
</html>
